name: Setup Android
description: Set up JDK 17, Gradle cache, and gradlew permissions for Android builds

runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Install Android API 37
      shell: bash
      run: |
        SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
        if [[ -z "$SDK_ROOT" ]]; then
          echo "::error::ANDROID_HOME and ANDROID_SDK_ROOT are both unset"
          exit 1
        fi
        SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
        if [[ ! -x "$SDKMANAGER" ]]; then
          echo "::error::sdkmanager not found at $SDKMANAGER"
          exit 1
        fi
        "$SDKMANAGER" --install "platforms;android-37.0" --channel=3

    - name: Grant execute permission for gradlew
      shell: bash
      working-directory: ./android
      run: chmod +x gradlew
